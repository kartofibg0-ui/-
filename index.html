<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Poppins", sans-serif;
    color: #fff;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        transparent 75%
    );
    -webkit-mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        transparent 75%
    );
}

.content {
    position: relative;
    z-index: 2;
    width: min(600px, 92vw);
    text-align: center;
    padding: 20px;
    opacity: 0;
    transform: translateY(18px);
    animation: intro 1s cubic-bezier(.22, 1, .36, 1) forwards;
}

@keyframes intro {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    display: inline-block;
    white-space: nowrap;
    font-size: clamp(32px, 7vw, 76px);
    font-weight: 600;
    letter-spacing: -3px;
    line-height: 1.1;
}

#dots {
    display: inline-block;
    width: 1.1em;
    text-align: left;
    letter-spacing: 0;
}

.subtitle {
    margin-top: 18px;
    color: #b5b5b5;
    font-size: clamp(11px, 1.5vw, 14px);
}

.form {
    display: flex;
    width: 100%;
    max-width: 460px;
    margin: 28px auto 0;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    height: clamp(40px, 4vw, 46px);
    padding: 0 16px;
    border: 1px solid #333;
    border-radius: 14px;
    outline: none;
    background: #0a0a0a;
    color: #fff;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    transition: border-color .25s ease, background-color .25s ease;
}

input::placeholder {
    color: #888;
}

input:focus {
    border-color: #666;
    background: #0d0d0d;
}

button {
    height: clamp(40px, 4vw, 46px);
    padding: 0 clamp(14px, 2.5vw, 20px);
    border: 1px solid #fff;
    border-radius: 14px;
    background: #fff;
    color: #000;
    font-family: "Poppins", sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition:
        background-color .3s ease,
        border-color .3s ease,
        transform .2s ease;
}

button:hover {
    background: #eaeaea;
    border-color: #eaeaea;
}

button:active {
    transform: scale(.98);
}

@media (max-width: 500px) {
    .content {
        width: 94vw;
        padding: 10px;
    }

    h1 {
        font-size: 10vw;
        letter-spacing: -2px;
    }

    .subtitle {
        margin-top: 14px;
        font-size: 12px;
    }

    .form {
        margin-top: 22px;
        gap: 6px;
    }

    input {
        padding: 0 12px;
        font-size: 11px;
    }

    button {
        padding: 0 14px;
        font-size: 11px;
    }
}

@media (max-width: 360px) {
    h1 {
        font-size: 9.5vw;
    }

    input {
        padding: 0 10px;
    }

    button {
        padding: 0 11px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="content">
    <h1>Coming Soon<span id="dots">.</span></h1>

    <p class="subtitle">
        Get notified early by leaving your email.
    </p>

    <form class="form">
        <input
            type="email"
            placeholder="Your email address"
            required
        >

        <button type="submit">
            Notify Me
        </button>
    </form>
</div>

<script>
const dots = document.getElementById("dots");

let count = 1;

setInterval(() => {
    count = count === 3 ? 1 : count + 1;
    dots.textContent = ".".repeat(count);
}, 500);
</script>

</body>
</html>
