<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Çok Yakında...</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

h1 {
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(32px, 7vw, 90px);
    font-weight: 700;
    letter-spacing: 3px;
    text-align: center;
}

#dots {
    display: inline-block;
    width: 1.5em;
    text-align: left;
}
</style>
</head>

<body>

<h1>
    ÇOK YAKINDA<span id="dots">.</span>
</h1>

<script>
const dots = document.getElementById("dots");

let count = 1;

setInterval(() => {
    count++;

    if (count > 3) {
        count = 1;
    }

    dots.textContent = ".".repeat(count);
}, 500);
</script>

</body>
</html>
