```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERROR//NULL</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
}

body {
    position: relative;
}

/* Background noise */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            #fff 3px
        );
    animation: scan 5s linear infinite;
}

@keyframes scan {
    from { transform: translateY(-10px); }
    to   { transform: translateY(10px); }
}

/* Moving symbols */
.symbols {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.symbol {
    position: absolute;
    color: #fff;
    opacity: 0;
    font-size: clamp(12px, 2vw, 22px);
    animation: float 7s linear infinite;
    text-shadow: 0 0 8px #fff;
}

@keyframes float {
    0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: .7; }
    80% { opacity: .35; }
    100% {
        transform: translateY(-20vh) rotate(360deg);
        opacity: 0;
    }
}

/* Main */
main {
    position: relative;
    z-index: 2;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.box {
    width: min(850px, 92vw);
    text-align: center;
    position: relative;
}

.small {
    font-size: 12px;
    letter-spacing: 5px;
    opacity: .5;
    margin-bottom: 20px;
}

h1 {
    position: relative;
    font-size: clamp(48px, 10vw, 120px);
    letter-spacing: -5px;
    line-height: .9;
    text-transform: uppercase;
    animation: flicker 3s infinite;
}

h1::before,
h1::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
}

h1::before {
    color: #fff;
    transform: translate(-3px, 1px);
    clip-path: inset(0 0 55% 0);
    animation: glitch1 1.8s infinite steps(2);
}

h1::after {
    color: #777;
    transform: translate(3px, -1px);
    clip-path: inset(55% 0 0 0);
    animation: glitch2 1.2s infinite steps(2);
}

@keyframes glitch1 {
    0%, 80%, 100% { clip-path: inset(0 0 55% 0); }
    82% { clip-path: inset(20% 0 30% 0); }
    85% { clip-path: inset(5% 0 70% 0); }
}

@keyframes glitch2 {
    0%, 70%, 100% { clip-path: inset(55% 0 0 0); }
    73% { clip-path: inset(65% 0 5% 0); }
    76% { clip-path: inset(40% 0 35% 0); }
}

@keyframes flicker {
    0%, 18%, 20%, 23%, 80%, 82%, 100% {
        opacity: 1;
    }
    19%, 21%, 81% {
        opacity: .35;
    }
}

.sub {
    margin: 35px auto;
    max-width: 600px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.8;
}

.terminal {
    margin: 30px auto;
    width: min(600px, 90vw);
    border: 1px solid #333;
    background: rgba(255,255,255,.025);
    padding: 18px;
    text-align: left;
    box-shadow: 0 0 30px rgba(255,255,255,.03);
}

.terminal-top {
    color: #555;
    font-size: 11px;
    margin-bottom: 14px;
}

.line {
    font-size: 13px;
    margin: 7px 0;
    color: #ddd;
}

.cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: white;
    vertical-align: middle;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.button {
    display: inline-block;
    margin-top: 15px;
    padding: 13px 28px;
    border: 1px solid #777;
    color: white;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    transition: .2s;
}

.button:hover {
    background: white;
    color: black;
    box-shadow: 0 0 30px rgba(255,255,255,.5);
}

.corner {
    position: fixed;
    font-size: 10px;
    color: #444;
    z-index: 5;
}

.tl { top: 15px; left: 15px; }
.tr { top: 15px; right: 15px; }
.bl { bottom: 15px; left: 15px; }
.br { bottom: 15px; right: 15px; }

.noise {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: .04;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="corner tl">ERR_001</div>
<div class="corner tr">SYS://UNKNOWN</div>
<div class="corner bl">0x000000</div>
<div class="corner br">?</div>

<div class="symbols" id="symbols"></div>

<main>
    <section class="box">

        <div class="small">WELCOME_TO_THE_VOID</div>

        <h1 data-text="NULL//404">NULL//404</h1>

        <p class="sub">
            ?@#%&gt;!@#&gt;:?@!#?&gt;!@<br>
            SIGNAL LOST // SYSTEM UNDEFINED // CONNECTION UNKNOWN
        </p>

        <div class="terminal">
            <div class="terminal-top">
                ┌─ TERMINAL / GHOST_NODE
            </div>

            <div class="line">&gt; initializing...</div>
            <div class="line">&gt; searching for signal...</div>
            <div class="line">&gt; <span id="typing"></span><span class="cursor"></span></div>
        </div>

        <a href="#" class="button" onclick="glitch(event)">
            ENTER_?
        </a>

    </section>
</main>

<script>
const chars = [
    "?@#!%>!@#>:?@!#?>!@",
    "0x00FF",
    "404",
    "NULL",
    "///",
    "???",
    "#!@%",
    "010101",
    "ERROR",
    "><><",
    "::://",
    "VOID"
];

const container = document.getElementById("symbols");

for (let i = 0; i < 35; i++) {
    const el = document.createElement("span");
    el.className = "symbol";
    el.textContent = chars[Math.floor(Math.random() * chars.length)];

    el.style.left = Math.random() * 100 + "%";
    el.style.animationDelay = Math.random() * 7 + "s";
    el.style.animationDuration = (4 + Math.random() * 8) + "s";

    container.appendChild(el);
}

/* Fake terminal typing */
const messages = [
    "ACCESSING_VOID...",
    "NO_USER_FOUND",
    "SYSTEM_ACCEPTED",
    "WELCOME, UNKNOWN",
    "REALITY.EXE NOT FOUND"
];

const typing = document.getElementById("typing");
let messageIndex = 0;
let charIndex = 0;

function type() {
    const message = messages[messageIndex];

    if (charIndex < message.length) {
        typing.textContent += message[charIndex++];
        setTimeout(type, 70);
    } else {
        setTimeout(() => {
            typing.textContent = "";
            charIndex = 0;
            messageIndex = (messageIndex + 1) % messages.length;
            type();
        }, 1200);
    }
}

type();

/* Button glitch */
function glitch(e) {
    e.preventDefault();

    document.body.style.filter = "invert(1)";

    setTimeout(() => {
        document.body.style.filter = "none";
    }, 80);

    setTimeout(() => {
        document.body.style.filter = "contrast(3)";

        setTimeout(() => {
            document.body.style.filter = "none";
        }, 100);
    }, 180);
}
</script>

</body>
</html>
